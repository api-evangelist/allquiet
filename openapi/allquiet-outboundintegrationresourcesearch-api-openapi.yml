openapi: 3.2.0
info:
  title: All Quiet Public Outbound Integration Resource Search API
  version: v1
tags:
- name: OutboundIntegrationResourceSearch
paths:
  /api/public/v1/outbound-integration/search:
    get:
      tags:
      - OutboundIntegrationResourceSearch
      summary: Search for a single outbound integration
      description: 'Find one outbound integration by exact display name, optional type, and/or team ID. Returns 404 when no match exists.


        **Required API key permissions**


        - **Scope:** `outbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: Type
        in: query
        schema:
          type: string
      - name: TeamId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: outbound-integrations
        permission: get
        scope: outbound-integrations:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1OutboundIntegrationSearch
      x-operation-id-source: derived
  /api/public/v1/outbound-integration/search/list:
    get:
      tags:
      - OutboundIntegrationResourceSearch
      summary: List outbound integrations
      description: 'Returns a paginated list of outbound integrations filtered by display name, type, and/or team ID.


        **Required API key permissions**


        - **Scope:** `outbound-integrations:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: Type
        in: query
        schema:
          type: string
      - name: TeamId
        in: query
        schema:
          type: string
          format: uuid
      - name: Offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: Limit
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: outbound-integrations
        permission: list
        scope: outbound-integrations:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1OutboundIntegrationSearchList
      x-operation-id-source: derived

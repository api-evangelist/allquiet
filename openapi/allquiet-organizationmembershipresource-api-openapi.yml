      x-operation-id-source: derived
components:
  schemas:
    AllQuiet.Api.Public.OrganizationMemberships.OrganizationMembershipResourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type:
          - string
          - 'null'
          format: uuid
        email:
          type:
          - string
          - 'null'
        role:
          type:
          - string
          - 'null'
        isProvisioned:
          type: boolean
      additionalProperties: false
    AllQuiet.Api.Public.OrganizationMemberships.OrganizationMembershipResourceRequest:
      required:
      - role
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
          format: uuid
        email:
          maxLength: 500
          type:
          - string
          - 'null'
          format: email
        role:
          minLength: 1
          type: string
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: apiKey
      description: 'API key authentication. Pass the key as `Authorization: Bearer <key>` or `X-Api-Key: <key>`. Each operation documents required scopes and accepted key types.'
      name: Authorization

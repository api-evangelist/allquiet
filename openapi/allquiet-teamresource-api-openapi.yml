openapi: 3.2.0
info:
  title: All Quiet Public Team Resource API
  version: v1
tags:
- name: TeamResource
paths:
  /api/public/v1/team/{id}:
    get:
      tags:
      - TeamResource
      summary: Get a team by ID
      description: 'Returns team settings including display name, timezone, labels, and calendar publishing. The team must be reachable through the caller''s organization or team restrictions.


        **Required API key permissions**


        - **Scope:** `teams:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: teams
        permission: get
        scope: teams:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Member
        notes: null
      operationId: getApiPublicV1TeamById
      x-operation-id-source: derived
    put:
      tags:
      - TeamResource
      summary: Update a team
      description: 'Update team settings such as display name, timezone, labels, and engagement report settings.


        **Required API key permissions**


        - **Scope:** `teams:update`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Organization role (user-linked keys only):** Member when the user has an explicit organization membership. Explicit organization membership is not required; team-based access applies and effective access is gated by the required team role.

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision
        in: query
        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: teams
        permission: update
        scope: teams:update
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: true
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: Administrator
        notes: null
      operationId: putApiPublicV1TeamById
      x-operation-id-source: derived
    delete:
      tags:
      - TeamResource
      summary: Delete a team
      description: 'Delete a team by ID.


        **Required API key permissions**


        - **Scope:** `teams:delete`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Organization role (user-linked keys only):** Member when the user has an explicit organization membership. Explicit organization membership is not required; team-based access applies and effective access is gated by the required team role.

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: teams
        permission: delete
        scope: teams:delete
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: true
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: Administrator
        notes: null
      operationId: deleteApiPublicV1TeamById
      x-operation-id-source: derived
  /api/public/v1/team:
    post:
      tags:
      - TeamResource
      summary: Create a team
      description: 'Create a team in an organization.


        **Required API key permissions**


        - **Scope:** `teams:create`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision
        in: query
        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: teams
        permission: create
        scope: teams:create
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Administrator
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: postApiPublicV1Team
      x-operation-id-source: derived
components:
  schemas:
    AllQuiet.Api.Teams.Models.IncidentEngagementReportSettings:
      type: object
      properties:
        dayOfWeek:
          type:
          - string
          - 'null'
        time:
          type:
          - string
          - 'null'
          format: time
        disableWeeklyIncidentEngagementReport:
          type: boolean
      additionalProperties: false
    AllQuiet.Api.Common.CalendarPublishingSettingsResponse:
      type: object
      properties:
        isPublished:
          type: boolean
        publicCalendarUrlOutlook:
          type:
          - string
          - 'null'
        publicCalendarUrlGoogle:
          type:
          - string
          - 'null'
        onlyIncludeTier1:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    AllQuiet.Api.Public.Teams.TeamResourceRequest:
      required:
      - displayName
      - timeZoneId
      type: object
      properties:
        displayName:
          maxLength: 500
          minLength: 1
          type: string
        incidentEngagementReportSettings:
          $ref: '#/components/schemas/AllQuiet.Api.Public.Teams.TeamResourceIncidentEngagementReportSettingsRequest'
        timeZoneId:
          minLength: 1
          type: string
        labels:
          type:
          - array
          - 'null'
          items:
            type: string
        calendarPublishingSettings:
          $ref: '#/components/schemas/AllQuiet.Api.Common.CalendarPublishingSettingsRequest'
      additionalProperties: false
    AllQuiet.Api.Public.Teams.TeamResourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        isProvisioned:
          type: boolean
        displayName:
          type:
          - string
          - 'null'
        timeZoneId:
          type:
          - string
          - 'null'
        labels:
          type:
          - array
          - 'null'
          items:
            type: string
        incidentEngagementReportSettings:
          $ref: '#/components/schemas/AllQuiet.Api.Teams.Models.IncidentEngagementReportSettings'
        tierSettings:
          $ref: '#/components/schemas/AllQuiet.Api.Teams.Models.TierSettings'
        calendarPublishingSettings:
          $ref: '#/components/schemas/AllQuiet.Api.Common.CalendarPublishingSettingsResponse'
      additionalProperties: false
    AllQuiet.Api.Teams.Models.TierSettings:
      type: object
      properties:
        repeats:
          maximum: 99
          minimum: 0
          type:
          - integer
          - 'null'
          format: int32
        repeatsAfterMinutes:
          maximum: 1440
          minimum: 0
          type:
          - integer
          - 'null'
          format: int32
        autoEscalationMode:
          type:
          - string
          - 'null'
      additionalProperties: false
    AllQuiet.Api.Public.Teams.TeamResourceIncidentEngagementReportSettingsRequest:
      type: object
      properties:
        dayOfWeek:
          type:
          - string
          - 'null'
        time:
          type:
          - string
          - 'null'
          format: time
        disableWeeklyIncidentEngagementReport:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    AllQuiet.Api.Common.CalendarPublishingSettingsRequest:
      type: object
      properties:
        isPublished:
          type:
          - boolean
          - 'null'
        onlyIncludeTier1:
          type:
          - boolean
          - 'null'
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: apiKey
      description: 'API key authentication. Pass the key as `Authorization: Bearer <key>` or `X-Api-Key: <key>`. Each operation documents required scopes and accepted key types.'
      name: Authorization
      in: header

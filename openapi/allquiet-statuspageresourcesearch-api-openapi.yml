openapi: 3.2.0
info:
  title: All Quiet Public Status Page Resource Search API
  version: v1
tags:
- name: StatusPageResourceSearch
paths:
  /api/public/v1/status-page/search:
    get:
      tags:
      - StatusPageResourceSearch
      summary: Search for a single status page
      description: 'Find one status page by exact display name within organizations visible to the caller. Returns 404 when no matching status page is found.


        **Required API key permissions**


        - **Scope:** `status-pages:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Notes:** Team-scoped API keys are not supported. User-linked keys without an explicit organization membership receive empty results.'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: OrganizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: get
        scope: status-pages:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Team-scoped API keys are not supported. User-linked keys without an explicit organization membership receive empty results.
      operationId: getApiPublicV1StatusPageSearch
      x-operation-id-source: derived
  /api/public/v1/status-page/search/list:
    get:
      tags:
      - StatusPageResourceSearch
      summary: List status pages
      description: 'List status pages visible to the caller with optional organization and display-name filters and paging (offset/limit).


        **Required API key permissions**


        - **Scope:** `status-pages:list`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Notes:** Team-scoped API keys are not supported. User-linked keys without an explicit organization membership receive empty results.'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: OrganizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: Offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: Limit
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: list
        scope: status-pages:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Team-scoped API keys are not supported. User-linked keys without an explicit organization membership receive empty results.
      operationId: getApiPublicV1StatusPageSearchList
      x-operation-id-source: derived

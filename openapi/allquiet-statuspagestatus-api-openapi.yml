openapi: 3.2.0
info:
  title: All Quiet Public Status Page Status API
  version: v1
tags:
- name: StatusPageStatus
paths:
  /api/public/v1/status-page/status/{id}:
    get:
      tags:
      - StatusPageStatus
      summary: Get live status page status
      description: 'Returns the current public status view for a status page, including component states and active incidents.


        **Required API key permissions**


        - **Scope:** `status-pages:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.Status.StatusPageStatusResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.Status.StatusPageStatusResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.Status.StatusPageStatusResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: get
        scope: status-pages:get
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1StatusPageStatusById
      x-operation-id-source: derived

info:
  title: All Quiet Public Incident Resource Search API
  version: v1
tags:
- name: IncidentResourceSearch
paths:
  /api/public/v1/incident/search/list:
    get:
      tags:
      - IncidentResourceSearch
      summary: Search and list incidents
      description: 'Filter incidents by status, severity, team, user, integration, archive state, and date range. Supports paging (offset/limit; limit max 100) and sorting. Results are limited to incidents visible to the caller''s key. Send If-None-Match with the ETag from a previous response to receive 304 Not Modified when the page is unchanged.


        **Required API key permissions**


        - **Scope:** `incidents:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: Statuses
        in: query
        schema:
          type: array
          items:
            type: string
      - name: Severities
        in: query
        schema:
          type: array
          items:
            type: string
      - name: IntegrationIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: TeamIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: UserIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: SearchTerm
        in: query
        schema:
          maxLength: 200
          type: string
      - name: Unattended
        in: query
        schema:
          type: boolean
      - name: IsArchived
        in: query
        schema:
          type: boolean
      - name: IncludeSnoozed
        in: query
        schema:
          type: boolean
      - name: OnlySnoozed
        in: query
        schema:
          type: boolean
      - name: CreatedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: CreatedUntil
        in: query
        schema:
          type: string
          format: date-time
      - name: CreatedUntilExclusive
        in: query
        schema:
          type: string
          format: date-time
      - name: LastUpdatedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: Limit
        in: query
        schema:
          type: integer
          format: int32
      - name: Offset
        in: query
        schema:
          type: integer
          format: int32
      - name: SortBy
        in: query
        schema:
          type: string
      - name: Asc
        in: query
        schema:
          type: boolean
      - name: If-None-Match
        in: header
        description: Weak ETag from a previous response. When it still matches, the server returns 304 Not Modified with an empty body.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak entity tag for the current response payload.
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-cache`.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
        '304':
          description: Not modified. The resource is unchanged; response body is empty.
          headers:
            ETag:
              description: Weak entity tag for the unchanged resource.
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-cache`.
              schema:
                type: string

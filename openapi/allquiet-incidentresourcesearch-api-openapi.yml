  /api/public/v1/incident/search/{incidentId}:
    get:
      tags:
      - IncidentResourceSearch
      summary: Get an incident by ID
      description: 'Returns a single incident the caller is authorized to view. Returns 404 when the incident does not exist or is outside the key''s allowed teams. Voicemail download attributes include voiceMail.downloadUrl (retrieve the audio with this API key) and voiceMail.privateDownloadUrl (signed-in web app). Send If-None-Match with the ETag from a previous response to receive 304 Not Modified when the incident has not changed.


        **Required API key permissions**


        - **Scope:** `incidents:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-None-Match
        in: header
        description: Weak ETag from a previous response. When it still matches, the server returns 304 Not Modified with an empty body.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        description: HTTP-date from a previous Last-Modified header. Used only when If-None-Match is not sent.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak entity tag for the current response payload.
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-cache`.
              schema:
                type: string
            Last-Modified:
              description: UTC time the incident was last updated.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
        '304':
          description: Not modified. The resource is unchanged; response body is empty.
          headers:
            ETag:
              description: Weak entity tag for the unchanged resource.
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-cache`.
              schema:
                type: string
            Last-Modified:
              description: UTC time the incident was last updated.
              schema:
                type: string
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: incidents
        permission: get
        scope: incidents:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)

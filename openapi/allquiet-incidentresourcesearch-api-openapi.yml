      x-operation-id-source: derived
  /api/public/v1/incident/search/changes:
    get:
      tags:
      - IncidentResourceSearch
      summary: Poll incident changes
      description: 'Returns incidents changed since the cursor watermark, ordered by LastUpdatedAt ascending. Use NextCursor on subsequent requests for incremental sync. Optionally pass Since to start from a point in time, or IncidentIds to watch a specific set. For push-based updates, configure an outbound Webhook integration instead of polling.


        **Required API key permissions**


        - **Scope:** `incidents:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: Cursor
        in: query
        schema:
          type: string
      - name: Limit
        in: query
        schema:
          type: integer
          format: int32
      - name: Since
        in: query
        schema:
          type: string
          format: date-time
      - name: IncidentIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: Statuses
        in: query
        schema:
          type: array
          items:
            type: string
      - name: Severities
        in: query
        schema:
          type: array
          items:
            type: string
      - name: IntegrationIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: TeamIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: IsArchived
        in: query
        schema:
          type: boolean
      - name: IncludeSnoozed
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceChangesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceChangesResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceChangesResponse'
        '400':

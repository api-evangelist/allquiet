        memberships:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponseMembership'
      additionalProperties: false
    AllQuiet.Api.Public.OnCall.OnCallResponseUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type:
          - string
          - 'null'
        avatarUrl:

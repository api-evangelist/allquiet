openapi: 3.2.0
info:
  title: All Quiet Public On Call API
  version: v1
tags:
- name: On Call
paths:
  /api/public/v1/on-call:
    get:
      tags:
      - On Call
      summary: Get current on-call assignments
      description: 'Returns users currently on call for teams accessible to the API key, optionally filtered by team IDs, user IDs, or a specific timestamp.


        **Required API key permissions**


        - **Scope:** `on-call:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Notes:** When userIds is provided, the caller must be able to read each requested user.'
      parameters:
      - name: TeamIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: UserIds
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: Timestamp
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: on-call
        permission: get
        scope: on-call:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: When userIds is provided, the caller must be able to read each requested user.
      operationId: getApiPublicV1OnCall
      x-operation-id-source: derived
components:

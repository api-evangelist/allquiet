      properties:
        user:
          $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponseUser'
        team:
          $ref: '#/components/schemas/AllQuiet.Api.Public.OnCall.OnCallResponseTeam'
        availabilities:
          type:
          - array
          - 'null'
          items:

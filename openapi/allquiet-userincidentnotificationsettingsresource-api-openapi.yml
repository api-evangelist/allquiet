openapi: 3.2.0
info:
  title: All Quiet Public User Incident Notification Settings…
  version: v1
tags:
- name: UserIncidentNotificationSettingsResource
paths:
  /api/public/v1/user/{userId}/incident-notification-settings:
    get:
      tags:
      - UserIncidentNotificationSettingsResource
      summary: Get incident notification settings for a user
      description: 'Returns how a user receives incident notifications.


        **Required API key permissions**


        - **Scope:** `user-incident-notification-settings:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** User-linked keys (personal access tokens) may only act on their own user.

        - **Root organization access:** API keys bound to a sub-organization may also read users provisioned in the root organization.

        - **Notes:** Personal access tokens may only access their linked user''s settings.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: user-incident-notification-settings
        permission: get
        scope: user-incident-notification-settings:get
        accessModel: user-self
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: true
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Personal access tokens may only access their linked user's settings.
      operationId: getApiPublicV1UserByUserIdIncidentNotificationSettings
      x-operation-id-source: derived
    post:
      tags:
      - UserIncidentNotificationSettingsResource
      summary: Create incident notification settings for a user
      description: 'Initializes incident notification preferences for the specified user.


        **Required API key permissions**


        - **Scope:** `user-incident-notification-settings:create`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** User-linked keys (personal access tokens) may only act on their own user.

        - **Self access:** personal access tokens may write their linked user''s resource even when the user belongs to multiple organizations.

        - **Notes:** Personal access tokens may only modify their linked user''s settings.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision
        in: query
        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: user-incident-notification-settings
        permission: create
        scope: user-incident-notification-settings:create
        accessModel: user-self
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: true
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Personal access tokens may only modify their linked user's settings.
      operationId: postApiPublicV1UserByUserIdIncidentNotificationSettings
      x-operation-id-source: derived
    put:
      tags:
      - UserIncidentNotificationSettingsResource
      summary: Update incident notification settings for a user
      description: 'Updates incident notification preferences for the specified user.


        **Required API key permissions**


        - **Scope:** `user-incident-notification-settings:update`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** User-linked keys (personal access tokens) may only act on their own user.

        - **Self access:** personal access tokens may write their linked user''s resource even when the user belongs to multiple organizations.

        - **Notes:** Personal access tokens may only modify their linked user''s settings. Organization API keys must pass ?provision=true to overwrite settings that are not provisioned (managed by the user in the UI).'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision

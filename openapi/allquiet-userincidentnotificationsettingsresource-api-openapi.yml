        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Users.UserIncidentNotificationSettingsResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: user-incident-notification-settings
        permission: update
        scope: user-incident-notification-settings:update
        accessModel: user-self
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: true
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Personal access tokens may only modify their linked user's settings. Organization API keys must pass ?provision=true to overwrite settings that are not provisioned (managed by the user in the UI).
      operationId: putApiPublicV1UserByUserIdIncidentNotificationSettings
      x-operation-id-source: derived
    delete:
      tags:
      - UserIncidentNotificationSettingsResource
      summary: Delete incident notification settings for a user
      description: 'Removes custom incident notification settings for the specified user, reverting to defaults.


        **Required API key permissions**


        - **Scope:** `user-incident-notification-settings:delete`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** User-linked keys (personal access tokens) may only act on their own user.

        - **Self access:** personal access tokens may write their linked user''s resource even when the user belongs to multiple organizations.

        - **Notes:** Personal access tokens may only modify their linked user''s settings.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: user-incident-notification-settings
        permission: delete
        scope: user-incident-notification-settings:delete
        accessModel: user-self
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: true
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Personal access tokens may only modify their linked user's settings.
      operationId: deleteApiPublicV1UserByUserIdIncidentNotificationSettings
      x-operation-id-source: derived

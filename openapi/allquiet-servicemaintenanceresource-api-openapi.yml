openapi: 3.2.0
info:
  title: All Quiet Public Service Maintenance Resource API
  version: v1
tags:
- name: ServiceMaintenanceResource
paths:
  /api/public/v1/service-maintenance/{id}:
    get:
      tags:
      - ServiceMaintenanceResource
      summary: Get a service maintenance window by ID
      description: 'Returns a single status-page service maintenance window.


        **Required API key permissions**


        - **Scope:** `service-maintenance:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: service-maintenance
        permission: get
        scope: service-maintenance:get
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1ServiceMaintenanceById
      x-operation-id-source: derived
    put:
      tags:
      - ServiceMaintenanceResource
      summary: Update a service maintenance window
      description: 'Updates an existing service maintenance window.


        **Required API key permissions**


        - **Scope:** `service-maintenance:update`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision
        in: query
        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceUpdateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.ServiceMaintenance.ServiceMaintenanceResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: service-maintenance
        permission: update
        scope: service-maintenance:update
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: putApiPublicV1ServiceMaintenanceById
      x-operation-id-source: derived
    delete:
      tags:
      - ServiceMaintenanceResource
      summary: Delete a service maintenance window
      description: 'Permanently deletes a service maintenance window.


        **Required API key permissions**


        - **Scope:** `service-maintenance:delete`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: service-maintenance
        permission: delete
        scope: service-maintenance:delete
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: deleteApiPublicV1ServiceMaintenanceById
      x-operation-id-source: derived

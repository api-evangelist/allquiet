openapi: 3.2.0
info:
  title: All Quiet Public Inbound Integration Resource API
  version: v1
tags:
- name: InboundIntegrationResource
paths:
  /api/public/v1/inbound-integration/{id}/call-routing-options:
    get:
      tags:
      - InboundIntegrationResource
      summary: Get call routing options for an inbound integration
      description: 'Returns available call-routing configuration options for a phone-based inbound integration. Use this before configuring Twilio or Bird call routing settings.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.CallRoutingOptionsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.CallRoutingOptionsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.CallRoutingOptionsResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: get
        scope: inbound-integrations:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Member
        notes: null
      operationId: getApiPublicV1InboundIntegrationByIdCallRoutingOptions
      x-operation-id-source: derived
  /api/public/v1/inbound-integration/{id}/call-routing-media/{purpose}:
    post:
      tags:
      - InboundIntegrationResource
      summary: Upload call routing media for an inbound integration
      description: 'Uploads an audio file used by call routing (for example a greeting or hold message). The purpose path segment identifies how the media is used in the integration''s call flow.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:update`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: purpose
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                style: form
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.Models.InboundNumberAudioFile'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.Models.InboundNumberAudioFile'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.CallRouting.Models.InboundNumberAudioFile'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: update
        scope: inbound-integrations:update
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Administrator
        notes: null
      operationId: postApiPublicV1InboundIntegrationByIdCallRoutingMediaByPurpose
      x-operation-id-source: derived
  /api/public/v1/inbound-integration/{id}:
    get:
      tags:
      - InboundIntegrationResource
      summary: Get an inbound integration by ID
      description: 'Returns a single inbound integration, including type-specific settings, webhook URL, and labels.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:

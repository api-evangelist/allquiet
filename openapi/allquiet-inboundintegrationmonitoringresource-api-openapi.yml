  /api/public/v1/inbound-integration/{integrationId}/http-monitoring-results/search/list:
    get:
      tags:
      - InboundIntegrationMonitoringResource
      summary: List HTTP monitoring execution results
      description: 'Returns paginated HTTP monitoring execution results for an inbound integration (default limit 20, max 100).


        **Required API key permissions**


        - **Scope:** `inbound-integrations:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).


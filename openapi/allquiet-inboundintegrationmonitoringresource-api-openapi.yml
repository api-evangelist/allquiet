      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: From
        in: query
        schema:
          type: string
          format: date-time
      - name: Until
        in: query
        schema:
          type: string
          format: date-time
      - name: Status
        in: query
        schema:
          type: array
          items:
            type: string
      - name: Offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: Limit
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationHttpMonitoringResultListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationHttpMonitoringResultListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationHttpMonitoringResultListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: list
        scope: inbound-integrations:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null

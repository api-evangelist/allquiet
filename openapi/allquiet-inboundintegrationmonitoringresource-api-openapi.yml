openapi: 3.2.0
info:
  title: All Quiet Public Inbound Integration Monitoring Resource API
  version: v1
tags:
- name: InboundIntegrationMonitoringResource
paths:
  /api/public/v1/inbound-integration/{integrationId}/heartbeat-result:
    get:
      tags:
      - InboundIntegrationMonitoringResource
      summary: Get heartbeat monitor result
      description: 'Returns the current heartbeat monitor state for an inbound integration.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.HeartbeatResultResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.HeartbeatResultResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.HeartbeatResultResourceResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: get
        scope: inbound-integrations:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Member
        notes: null
      operationId: getApiPublicV1InboundIntegrationByIntegrationIdHeartbeatResult
      x-operation-id-source: derived

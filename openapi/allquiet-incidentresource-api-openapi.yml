openapi: 3.2.0
info:
  title: All Quiet Public Incident Resource API
  version: v1
tags:
- name: IncidentResource
paths:
  /api/public/v1/incident/{incidentId}:
    patch:
      tags:
      - IncidentResource
      summary: Update an incident
      description: 'Apply patch operations to an existing incident (severity, status, attributes, and similar). Rate-limited per incident.


        **Required API key permissions**


        - **Scope:** `incidents:update`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Organization role (user-linked keys only):** Member when the user has an explicit organization membership. Explicit organization membership is not required; team-based access applies and effective access is gated by the required team role.

        - Organization API keys are not subject to organization or team role checks.

        - **Notes:** Rate-limited per incident.'
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Incidents.IncidentPatchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Incidents.IncidentPatchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Incidents.IncidentPatchRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: incidents
        permission: update
        scope: incidents:update
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: true
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: Rate-limited per incident.
      operationId: patchApiPublicV1IncidentByIncidentId
      x-operation-id-source: derived
    delete:
      tags:
      - IncidentResource
      summary: Delete an incident
      description: 'Permanently delete an incident. The incident must be archived first (append the ''Archived'' intent via PATCH).


        **Required API key permissions**


        - **Scope:** `incidents:delete`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Organization role (user-linked keys only):** Member when the user has an explicit organization membership. Explicit organization membership is not required; team-based access applies and effective access is gated by the required team role.

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.

        - **Notes:** For user-linked keys, deletion requires the organization Administrator role or the team Administrator role on one of the incident''s teams. Only archived incidents can be deleted. The incidents:delete permission is only grantable on unrestricted API keys.'
      parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: incidents
        permission: delete
        scope: incidents:delete
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: true
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: Administrator
        notes: For user-linked keys, deletion requires the organization Administrator role or the team Administrator role on one of the incident's teams. Only archived incidents can be deleted. The incidents:delete permission is only grantable on unrestricted API keys.
      operationId: deleteApiPublicV1IncidentByIncidentId
      x-operation-id-source: derived
  /api/public/v1/incident:
    post:
      tags:
      - IncidentResource
      summary: Create an incident
      description: 'Create a new incident in an authorized team. Subject to creation rate limits.


        **Required API key permissions**


        - **Scope:** `incidents:create`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Organization role (user-linked keys only):** Member when the user has an explicit organization membership. Explicit organization membership is not required; team-based access applies and effective access is gated by the required team role.

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.

        - **Notes:** Target teams must belong to the resolved organization. Subject to creation rate limits.'
      parameters:
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceCreateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResourceCreateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Incidents.IncidentResource'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: incidents
        permission: create
        scope: incidents:create
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: true
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: Member
        notes: Target teams must belong to the resolved organization. Subject to creation rate limits.
      operationId: postApiPublicV1Incident
      x-operation-id-source: derived

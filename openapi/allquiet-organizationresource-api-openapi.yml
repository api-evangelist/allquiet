    get:
      tags:
      - OrganizationResource
      summary: List organizations accessible to the API key
      description: 'Returns all organizations the authenticated API key is authorized to read.


        **Required API key permissions**


        - **Scope:** `organizations:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Common.ListResponse_1__AllQuiet.Api.Public.Organizations.OrganizationResourceResponse__AllQuiet.Api.Public__Version_0.0.4229.0__Culture_neutral__PublicKeyToken_null'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Common.ListResponse_1__AllQuiet.Api.Public.Organizations.OrganizationResourceResponse__AllQuiet.Api.Public__Version_0.0.4229.0__Culture_neutral__PublicKeyToken_null'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Common.ListResponse_1__AllQuiet.Api.Public.Organizations.OrganizationResourceResponse__AllQuiet.Api.Public__Version_0.0.4229.0__Culture_neutral__PublicKeyToken_null'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: organizations
        permission: list
        scope: organizations:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1Organizations
      x-operation-id-source: derived
    post:
      tags:
      - OrganizationResource
      summary: Create an organization
      description: 'Creates a new organization.


        Authorization:

        - Organization API key: creates a sub-organization under the key''s root organization only. The key must be bound to a root organization (IsRootOrganization). rootOrganizationId in the body must not be set; the child inherits the root org billable user. Keys bound to a sub-organization cannot create further sub-organizations.

        - Personal access token (PAT): delegates to the token user''s permissions. Top-level org creation omits rootOrganizationId and is allowed for any user with organizations:create scope. Child org creation requires organizations:create scope plus Owner role on the root org, matching billable user, and the root org must be IsRootOrganization. Sub-organizations cannot be used as rootOrganizationId.


        **Required API key permissions**


        - **Scope:** `organizations:create`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Notes:** Organization API keys can create sub-organizations under the key''s root organization only. Personal access tokens creating a child organization require the Owner role on the root organization.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceCreateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceCreateRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: organizations
        permission: create
        scope: organizations:create
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: Organization API keys can create sub-organizations under the key's root organization only. Personal access tokens creating a child organization require the Owner role on the root organization.
      operationId: postApiPublicV1Organizations
      x-operation-id-source: derived

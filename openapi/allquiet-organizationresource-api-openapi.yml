        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1OrganizationsById
      x-operation-id-source: derived
    put:
      tags:
      - OrganizationResource
      summary: Update an organization
      description: 'Updates organization properties such as display name.


        **Required API key permissions**


        - **Scope:** `organizations:update`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required organization role (user-linked keys only):** Owner

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceUpdateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Organizations.OrganizationResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: organizations
        permission: update
        scope: organizations:update
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Owner
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: putApiPublicV1OrganizationsById
      x-operation-id-source: derived
    delete:
      tags:
      - OrganizationResource
      summary: Delete an organization
      description: 'Permanently deletes an organization. The organization must be accessible to the API key.


        **Required API key permissions**


        - **Scope:** `organizations:delete`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required organization role (user-linked keys only):** Owner

        - Organization API keys are not subject to organization or team role checks.

        - **Notes:** Organization API keys of a root organization may delete sub-organizations only.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - ApiKey: []
      x-api-key-requirements:

tags:
- name: InboundIntegrationMappingResource
paths:
  /api/public/v1/inbound-integration/{integrationId}/mapping:
    get:
      tags:
      - InboundIntegrationMappingResource
      summary: Get attribute mapping for an inbound integration
      description: 'Returns the attribute mapping that transforms incoming alert payloads for the given integration.


        **Required API key permissions**


        - **Scope:** `inbound-integration-mappings:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integration-mappings
        permission: get
        scope: inbound-integration-mappings:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Member
        notes: null
      operationId: getApiPublicV1InboundIntegrationByIntegrationIdMapping
      x-operation-id-source: derived

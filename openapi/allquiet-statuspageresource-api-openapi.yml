openapi: 3.2.0
info:
  title: All Quiet Public Status Page Resource API
  version: v1
tags:
- name: StatusPageResource
paths:
  /api/public/v1/status-page/{id}:
    get:
      tags:
      - StatusPageResource
      summary: Get a status page by ID
      description: 'Returns a single status page configuration, including branding, services, and visibility settings.


        **Required API key permissions**


        - **Scope:** `status-pages:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: get
        scope: status-pages:get
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1StatusPageById
      x-operation-id-source: derived
    put:
      tags:
      - StatusPageResource
      summary: Update a status page
      description: 'Updates an existing status page by ID, including services, branding, and public visibility options.


        **Required API key permissions**


        - **Scope:** `status-pages:update`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: provision
        in: query
        description: When true, the created or updated resource is marked as provisioned and becomes read-only in the web UI. Defaults to false on create. On update, omitting this parameter preserves the existing provisioned state. Not available for personal access tokens.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceUpdateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: update
        scope: status-pages:update
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Administrator
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: putApiPublicV1StatusPageById
      x-operation-id-source: derived
    delete:
      tags:
      - StatusPageResource
      summary: Delete a status page
      description: 'Permanently deletes a status page by ID.


        **Required API key permissions**


        - **Scope:** `status-pages:delete`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: status-pages
        permission: delete
        scope: status-pages:delete
        accessModel: org-singleton
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Administrator
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: deleteApiPublicV1StatusPageById
      x-operation-id-source: derived

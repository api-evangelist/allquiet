info:
  title: All Quiet Public Outbound Integration Resource API
  version: v1
tags:
- name: OutboundIntegrationResource
paths:
  /api/public/v1/outbound-integration/{id}:
    get:
      tags:
      - OutboundIntegrationResource
      summary: Get an outbound integration by ID
      description: 'Returns a single outbound integration, including type-specific settings such as Slack or Mattermost configuration.


        **Required API key permissions**


        - **Scope:** `outbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OutboundIntegrations.OutboundIntegrationResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: outbound-integrations
        permission: get
        scope: outbound-integrations:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Member
        notes: null
      operationId: getApiPublicV1OutboundIntegrationById
      x-operation-id-source: derived
    put:
      tags:
      - OutboundIntegrationResource
      summary: Update an outbound integration
      description: 'Updates an existing outbound integration by ID, including forwarding behavior and channel settings.


        **Required API key permissions**


        - **Scope:** `outbound-integrations:update`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

  title: All Quiet Public Audit Log Resource Search API
  version: v1
tags:
- name: AuditLogResourceSearch
paths:
  /api/public/v1/auditlog/list:
    get:
      tags:
      - AuditLogResourceSearch
      summary: List audit log entries for an organization
      description: 'Returns paginated audit log events for the organization. Auditing must be enabled on the organization.


        **Required API key permissions**


        - **Scope:** `audit-log:list`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.

        - **Notes:** Auditing must be enabled on the organization.'
      parameters:
      - name: Cursor
        in: query
        schema:
          type: string
      - name: Limit
        in: query
        schema:
          type: integer
          format: int32
      - name: EntityType
        in: query
        schema:
          type: string
      - name: EntityId
        in: query
        schema:
          type: string
      - name: Action
        in: query
        schema:
          type: string
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Auditing.AuditLogResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Auditing.AuditLogResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.Auditing.AuditLogResourceListResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '403':

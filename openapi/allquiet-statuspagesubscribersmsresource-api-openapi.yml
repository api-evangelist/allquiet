      summary: Get a status page SMS subscriber by ID
      description: 'Returns a single SMS subscriber for a status page.


        **Required API key permissions**


        - **Scope:** `status-page-subscriber-sms:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Operates on a single organization. Pass organizationId when your API key spans multiple organizations.

        - **Required organization role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.StatusPages.StatusPageSubscriberSMSResourceResponse'

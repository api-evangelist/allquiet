paths:
  /api/public/v1/inbound-integration/{integrationId}/payloads/search/list:
    get:
      tags:
      - InboundIntegrationPayloadResourceSearch
      summary: List inbound integration payloads
      description: 'Returns paginated payloads for an inbound integration. Supports cursor-style paging via idLessThan.


        **Required API key permissions**


        - **Scope:** `inbound-integration-payloads:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required team role (user-linked keys only):** Administrator

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: IdLessThan
        in: query
        schema:
          type: string
      - name: Limit
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationPayloadResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationPayloadResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationPayloadResourceListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integration-payloads
        permission: list
        scope: inbound-integration-payloads:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: Administrator
        notes: null
      operationId: getApiPublicV1InboundIntegrationByIntegrationIdPayloadsSearchList
      x-operation-id-source: derived

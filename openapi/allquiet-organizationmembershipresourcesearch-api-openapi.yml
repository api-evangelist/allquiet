  /api/public/v1/organization-membership/search:
    get:
      tags:
      - OrganizationMembershipResourceSearch
      summary: Search for a single organization membership
      description: 'Find one organization membership by organization ID and user ID. Returns 404 when no matching membership is found.


        **Required API key permissions**


        - **Scope:** `organization-memberships:get`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: OrganizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: UserId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OrganizationMemberships.OrganizationMembershipResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OrganizationMemberships.OrganizationMembershipResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.OrganizationMemberships.OrganizationMembershipResourceResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: organization-memberships
        permission: get
        scope: organization-memberships:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - personal access token (org-wide)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: Member
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1OrganizationMembershipSearch
      x-operation-id-source: derived
  /api/public/v1/organization-membership/search/list:
    get:
      tags:
      - OrganizationMembershipResourceSearch
      summary: List organization memberships
      description: 'Returns paginated organization memberships filtered by organization ID, user ID, and/or role (default limit 100, max 100).


        **Required API key permissions**


        - **Scope:** `organization-memberships:list`

        - **Accepted key types:** organization API key (org-wide), personal access token (org-wide)

        - **Access:** Access is checked against the specific resource (team or organization reachability).

        - **Required organization role (user-linked keys only):** Member

        - Organization API keys are not subject to organization or team role checks.'
      parameters:
      - name: OrganizationId
        in: query
        schema:
          type: string
          format: uuid
      - name: UserId
        in: query
        schema:
          type: string
          format: uuid
      - name: Role
        in: query
        schema:
          type: string
      - name: Offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: Limit
        in: query

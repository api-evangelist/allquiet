openapi: 3.2.0
info:
  title: All Quiet Public Inbound Integration Resource Search API
  version: v1
tags:
- name: InboundIntegrationResourceSearch
paths:
  /api/public/v1/inbound-integration/search:
    get:
      tags:
      - InboundIntegrationResourceSearch
      summary: Search for a single inbound integration
      description: 'Finds one inbound integration matching display name, type, and/or team ID. Returns 404 when no match exists.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:get`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: Type
        in: query
        schema:
          type: string
      - name: TeamId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: get
        scope: inbound-integrations:get
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1InboundIntegrationSearch
      x-operation-id-source: derived
  /api/public/v1/inbound-integration/search/list:
    get:
      tags:
      - InboundIntegrationResourceSearch
      summary: List inbound integrations
      description: 'Returns a paginated list of inbound integrations filtered by display name, type, and/or team ID. Use offset and limit query parameters for pagination.


        **Required API key permissions**


        - **Scope:** `inbound-integrations:list`

        - **Accepted key types:** organization API key (org-wide), organization API key (team-scoped), personal access token (org-wide), personal access token (team-scoped)

        - **Access:** Access is checked against the specific resource (team or organization reachability).'
      parameters:
      - name: DisplayName
        in: query
        schema:
          type: string
      - name: Type
        in: query
        schema:
          type: string
      - name: TeamId
        in: query
        schema:
          type: string
          format: uuid
      - name: Offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: Limit
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AllQuiet.Api.Public.InboundIntegrations.InboundIntegrationResourceListResponse'
      security:
      - ApiKey: []
      x-api-key-requirements:
        resource: inbound-integrations
        permission: list
        scope: inbound-integrations:list
        accessModel: resource-scoped
        allowedKeyTypes:
        - organization API key (org-wide)
        - organization API key (team-scoped)
        - personal access token (org-wide)
        - personal access token (team-scoped)
        acceptsDerivedOrgMembershipForUserKeys: false
        grantsRootOrganizationUserReadAccess: false
        grantsUserSelfWriteAccess: false
        requiredOrgRoleForUserKeys: null
        requiredTeamRoleForUserKeys: null
        notes: null
      operationId: getApiPublicV1InboundIntegrationSearchList
      x-operation-id-source: derived

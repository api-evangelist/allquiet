            $ref: '#/components/schemas/AllQuiet.Api.Public.OnCallOverride.OnCallOverrideResourceResponse'
        hasMore:
          type: boolean
      additionalProperties: false
    AllQuiet.Api.Public.OnCallOverride.OnCallOverrideResourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        teamId:
          type:
          - string
          - 'null'
          format: uuid
        replacementUserIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        type:
          type:
          - string
          - 'null'
        start:
          type:
          - string
          - 'null'
          format: date-time
        end:
          type:
          - string
          - 'null'
          format: date-time
        isProvisioned:
          type: boolean
      additionalProperties: false
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    ApiKey:
      type: apiKey
      description: 'API key authentication. Pass the key as `Authorization: Bearer <key>` or `X-Api-Key: <key>`. Each operation documents required scopes and accepted key types.'
      name: Authorization
      in: header
